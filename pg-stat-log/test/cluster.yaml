apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ($values.name)
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: (regex_replace_all('^.*minimal-', $values.pg_image, 'postgresql-minimal-'))
    major: 18
  instances: 1
  storage:
    size: 1Gi
  postgresql:
    parameters: ($values.postgresql_parameters)
    shared_preload_libraries: ($values.shared_preload_libraries)
    extensions: ($values.extensions)
  bootstrap:
    initdb:
      postInitApplicationSQL:
      - |
        DO $test$
        BEGIN
          -- Default installation must follow the shipped control file, rather
          -- than merely accepting the version supplied by image metadata.
          CREATE EXTENSION pg_stat_log;
          IF (SELECT extversion FROM pg_extension WHERE extname = 'pg_stat_log') <> '0.3' THEN
            RAISE EXCEPTION 'default pg_stat_log SQL version must be 0.3';
          END IF;
          PERFORM query_id FROM pg_stat_log;
          PERFORM query_id FROM pg_stat_log_data();
          DROP EXTENSION pg_stat_log;

          -- Packages 0.1 and 0.2 both installed SQL version 0.1.
          CREATE EXTENSION pg_stat_log VERSION '0.1';
          PERFORM count FROM pg_stat_log;
          ALTER EXTENSION pg_stat_log UPDATE TO '0.3';
          IF (SELECT extversion FROM pg_extension WHERE extname = 'pg_stat_log') <> '0.3' THEN
            RAISE EXCEPTION 'pg_stat_log SQL upgrade must reach 0.3';
          END IF;
          PERFORM query_id FROM pg_stat_log;
          PERFORM query_id FROM pg_stat_log_data();
          IF NOT has_table_privilege('pg_read_all_stats', 'pg_stat_log', 'SELECT')
             OR NOT has_function_privilege('pg_read_all_stats', 'pg_stat_log_data()', 'EXECUTE')
             OR has_table_privilege('public', 'pg_stat_log', 'SELECT')
             OR has_function_privilege('public', 'pg_stat_log_data()', 'EXECUTE') THEN
            RAISE EXCEPTION 'pg_stat_log upgrade must preserve default access restrictions';
          END IF;
          DROP EXTENSION pg_stat_log;
        END
        $test$;
