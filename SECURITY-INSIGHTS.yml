header:
  schema-version: 2.2.0
  last-updated: '2026-08-04'
  last-reviewed: '2026-08-04'
  url: https://raw.githubusercontent.com/cnpg-extensions/postgres-extensions-containers/main/SECURITY-INSIGHTS.yml
  # Reference the main SECURITY-INSIGHTS file from the CNPG project.
  project-si-source: https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/main/SECURITY-INSIGHTS.yml

repository:
  url: https://github.com/cnpg-extensions/postgres-extensions-containers
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Gabriele Bartolini
      email: gabriele.bartolini@enterprisedb.com
      primary: true
    - name: Leonardo Cecchi
      email: leonardo.cecchi@enterprisedb.com
      primary: false
    - name: Marco Nenciarini
      email: marco.nenciarini@enterprisedb.com
      primary: false
    - name: Francesco Canovai
      email: francesco.canovai@enterprisedb.com
      primary: false
    - name: Armando Ruocco
      email: armando.ruocco@enterprisedb.com
      primary: false
    - name: Niccolò Fei
      email: niccolo.fei@enterprisedb.com
      primary: false
    - name: Gabriele Fedi
      email: gabriele.fedi@enterprisedb.com
      primary: false
  license:
    url: https://www.apache.org/licenses/LICENSE-2.0
    expression: Apache-2.0

  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/age
        comment: GitHub packages for the age extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/debversion
        comment: GitHub packages for the debversion extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/h3
        comment: GitHub packages for the h3 extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/mobilitydb
        comment: GitHub packages for the MobilityDB extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/mysql-fdw
        comment: GitHub packages for the mysql_fdw extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pg-cron
        comment: GitHub packages for the pg_cron extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pg-rrule
        comment: GitHub packages for the pg_rrule extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pg-uuidv7
        comment: GitHub packages for the pg_uuidv7 extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pgagent
        comment: GitHub packages for the pgagent extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pgmemcache
        comment: GitHub packages for the pgmemcache extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pgmp
        comment: GitHub packages for the pgmp extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pgsphere
        comment: GitHub packages for the pgsphere extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/pldebugger
        comment: GitHub packages for the pldebugger extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/plprofiler
        comment: GitHub packages for the plprofiler extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/plr
        comment: GitHub packages for the plr extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/q3c
        comment: GitHub packages for the q3c extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/snakeoil
        comment: GitHub packages for the pg_snakeoil extension image
      - uri: https://github.com/cnpg-extensions/postgres-extensions-containers/pkgs/container/tds-fdw
        comment: GitHub packages for the tds_fdw extension image

  security:
    tools:
      - name: Dependabot
        type: SCA
        rulesets: ["default"]
        results: {}
        integration:
          adhoc: true
          ci: false
          release: false
      - name: Renovate
        type: SCA
        rulesets: ["default"]
        results: {}
        integration:
          adhoc: true
          ci: true
          release: false
      - name: Snyk
        type: container
        rulesets: ["default"]
        results: {}
        comment: Scans container images for known vulnerabilities.
        integration:
          adhoc: false
          ci: true
          release: true
      - name: Cosign
        type: container
        rulesets: ["default"]
        results: {}
        comment: Used to cryptographically sign container images.
        integration:
          adhoc: false
          ci: true
          release: true
      - name: CodeQL
        type: SAST
        rulesets: ["default"]
        results: {}
        comment: GitHub's default CodeQL setup; analyzes Go and GitHub Actions workflow code on pull requests and pushes to main.
        integration:
          adhoc: false
          ci: true
          release: false
      - name: GitHub Code Scanning
        type: SAST
        rulesets: ["default"]
        results: {}
        comment: Ingests SARIF results from Snyk for integrated GitHub security alerts.
        integration:
          adhoc: false
          ci: true
          release: true
      - name: Dockle
        type: container
        rulesets: ["default"]
        results: {}
        comment: Container image linter enforcing CIS Docker Benchmark best practices; fails the build on any warning.
        integration:
          adhoc: false
          ci: true
          release: true

    assessments:
      self:
        comment: Refer to the main project.
