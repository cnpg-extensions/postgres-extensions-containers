  security:
    tools:
      - name: Dependabot
        type: SCA
        rulesets: ["default"]
        results: {}
        integration:
          adhoc: true
          ci: false
          release: false
      - name: Renovate
        type: SCA
        rulesets: ["default"]
        results: {}
        integration:
          adhoc: true
          ci: true
          release: false
      - name: Snyk
        type: container
        rulesets: ["default"]
        results: {}
        comment: Scans container images for known vulnerabilities.
        integration:
          adhoc: false
          ci: true
          release: true
      - name: Cosign
        type: container
        rulesets: ["default"]
        results: {}
        comment: Used to cryptographically sign container images.
        integration:
          adhoc: false
          ci: true
          release: true
      - name: CodeQL
        type: SAST
        rulesets: ["default"]
        results: {}
        comment: GitHub's default CodeQL setup; analyzes Go and GitHub Actions workflow code on pull requests and pushes to main.
        integration:
          adhoc: false
          ci: true
          release: false
      - name: GitHub Code Scanning
        type: SAST
        rulesets: ["default"]
        results: {}
        comment: Ingests SARIF results from Snyk for integrated GitHub security alerts.
        integration:
          adhoc: false
          ci: true
          release: true
      - name: Dockle
        type: container
        rulesets: ["default"]
        results: {}
        comment: Container image linter enforcing CIS Docker Benchmark best practices; fails the build on any warning.
        integration:
          adhoc: false
          ci: true
          release: true

    assessments:
      self:
        comment: Refer to the main project.
