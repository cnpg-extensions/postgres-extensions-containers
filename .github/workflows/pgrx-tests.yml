name: PGRX contract tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: PGRX contract tests
    runs-on: ubuntu-26.04
    env:
      # renovate: datasource=docker depName=ghcr.io/cnpg-extensions/cnpg-sbom-generator versioning=docker
      SBOM_GENERATOR: ghcr.io/cnpg-extensions/cnpg-sbom-generator:latest@sha256:9909ad887161b18d68f1e84c5568be3e8d3072ad861be843b596a0fdb6c48678
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run PGRX contract tests
        run: |
          docker run --rm --entrypoint python3 \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            "$SBOM_GENERATOR" pgrx/test.py

      - name: Check Debian and PGRX selection behavior
        run: |
          docker run --rm --entrypoint python3 \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            "$SBOM_GENERATOR" -c 'import json, pathlib, yaml; print(json.dumps({name: yaml.safe_load(pathlib.Path(f".github/workflows/{file}.yml").read_text()) for name, file in [("debian", "bake"), ("pgrx", "pgrx")]}))' \
            > "$RUNNER_TEMP/selection-workflows.json"
          python3 pgrx/tests/check_selection.py < "$RUNNER_TEMP/selection-workflows.json"
