name: Build, test and publish PGRX extensions
'on':
  workflow_dispatch:
    inputs:
      extension_name:
        description: PGRX extension directory, or all to rebuild every PGRX extension
        type: string
        required: true
      cnpg_version:
        description: Optional CNPG full version or main
        type: string
        required: false
        default: ''
  # Keep the required check present on unrelated PRs and merge-queue commits.
  pull_request:
  merge_group:
  push:
    branches: [main]
defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'
permissions: {}
jobs:
  discover:
    name: Check changed files
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch valid targets
        id: get-targets
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.11
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger/maintenance/
          args: get-targets --build-system pgrx

      - name: Validate extension name
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          if [[ "$INPUT_EXTENSION_NAME" != all ]] && ! echo "$VALID_TARGETS" | jq -e --arg ext "$INPUT_EXTENSION_NAME" 'index($ext)' > /dev/null; then
            echo "::error::'$INPUT_EXTENSION_NAME' is not a valid extension target. Use 'all' or one of: $VALID_TARGETS"
            exit 1
          fi

      - name: Compute paths-filter extensions block
        env:
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          if ! echo "$VALID_TARGETS" | jq -e 'length > 0' > /dev/null; then
            echo "::error::dagger get-targets returned no extensions: $VALID_TARGETS"
            exit 1
          fi
          {
            echo 'EXTENSIONS<<YAML_EOF'
            echo "$VALID_TARGETS" | jq -r '.[] |
              "\(.):\n  - \"\(.)/**\"\n  - \"!\(.)/test/**\"\n  - \"!\(.)/**/*.md\"\n_test_\(.):\n  - \"\(.)/test/**\""'
            echo 'YAML_EOF'
          } >> "$GITHUB_ENV"

      - name: Check for changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            _shared:
              - 'docker-bake.hcl'
              - 'docker-bake-pgrx.hcl'
              - 'pgrx/**'
              - 'scripts/**'
              - 'Taskfile.yml'
              - 'test/**'
              - 'dagger/maintenance/**'
              - '.github/workflows/**'
            ${{ env.EXTENSIONS }}

      # Only payload changes rebuild on main; shared and test changes validate on branches.
      - name: Compute matrix
        id: get-matrix
        env:
          # JSON array containing the extensions that have been changed
          CHANGES: ${{ steps.filter.outputs.changes }}
          # Input Extension name
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          EVENT_NAME: ${{ github.event_name }}
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
          # Standard packaging and the install path with a guarded lock correction.
          INFRASTRUCTURE_SAMPLE: '["pg-durable", "pg-session-jwt"]'
        run: |
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ "$INPUT_EXTENSION_NAME" == all ]]; then
              CHANGES="$VALID_TARGETS"
            else
              CHANGES=$(jq -cn --arg ext "$INPUT_EXTENSION_NAME" '[$ext]')
            fi
          else
            CHANGES=$(jq -ce --arg ref "$GITHUB_REF" --argjson targets "$VALID_TARGETS" \
              --argjson sample "$INFRASTRUCTURE_SAMPLE" '
              . as $changes
              | (map(select(startswith("_") | not))) as $direct
              | if $ref == "refs/heads/main" then $direct
                else
                  if ($sample - $targets | length) > 0 then
                    error("Infrastructure sample contains an unknown extension")
                  else
                    $direct + (map(select(startswith("_test_")) | ltrimstr("_test_")))
                    + (if $changes | index("_shared") then $sample else [] end)
                  end
                end | unique
            ' <<< "$CHANGES")
          fi

          echo "matrix=$(jq -c . <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

  contracts:
    permissions:
      contents: read
    uses: ./.github/workflows/pgrx-tests.yml
  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/pgrx_targets.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    with:
      extension_name: ${{ matrix.extension }}
      cnpg_version: ${{ inputs.cnpg_version }}
  gate:
    name: PGRX acceptance
    if: ${{ always() }}
    needs:
    - discover
    - contracts
    - build
    runs-on: ubuntu-24.04
    steps:
    - env:
        DISCOVERY: ${{ needs.discover.result }}
        CONTRACTS: ${{ needs.contracts.result }}
        BUILDS: ${{ needs.build.result }}
        MATRIX: ${{ needs.discover.outputs.matrix }}
      run: |-
        python3 - <<'PYTHON'
        import json, os
        if os.environ['DISCOVERY'] != 'success':
            raise SystemExit('Extension discovery did not succeed')
        if os.environ['CONTRACTS'] != 'success':
            raise SystemExit('PGRX contract tests did not succeed')
        matrix = json.loads(os.environ['MATRIX'])
        if not isinstance(matrix, list) or any(not isinstance(x, str) or not x for x in matrix):
            raise SystemExit('Invalid extension matrix')
        expected = 'success' if matrix else 'skipped'
        if os.environ['BUILDS'] != expected:
            raise SystemExit(f"Expected builds={expected}, got {os.environ['BUILDS']}")
        PYTHON
  catalogs:
    name: Update Catalogs
    needs: [discover, gate]
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - name: Repository Dispatch
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
      with:
        event-type: update-catalogs
