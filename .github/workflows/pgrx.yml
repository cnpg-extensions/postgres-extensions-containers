name: Build, test and publish PGRX extensions
'on':
  workflow_dispatch:
    inputs:
      extension_name:
        description: PGRX extension directory
        type: string
        required: true
      cnpg_version:
        description: CNPG fixture selector
        type: string
        required: false
        default: ''
  push:
    paths:
    - pgrx/**
    - docker-bake-pgrx.hcl
    - .github/workflows/pgrx*.yml
    - dagger/maintenance/**
    - '*/Dockerfile'
    - '*/metadata.hcl'
    - Taskfile.yml
permissions: {}
jobs:
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
    - name: Use current workspace
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Write typed inputs
      env:
        INPUTS_JSON: ${{ toJSON(inputs) }}
      run: printf '%s\n' "$INPUTS_JSON" > "$RUNNER_TEMP/pgrx-inputs.json"
    - id: select
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |-
        if [[ "$EVENT" == workflow_dispatch ]]; then
          MATRIX=$(python3 pgrx/workflow.py --inputs "$RUNNER_TEMP/pgrx-inputs.json")
        else
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            MATRIX=$(python3 pgrx/workflow.py)
          else
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt"
            MATRIX=$(python3 pgrx/workflow.py --changed-paths "$RUNNER_TEMP/changed.txt")
          fi
        fi
        printf 'matrix=%s\n' "$MATRIX" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/pgrx_targets.yml
    with:
      extension_name: ${{ matrix.extension }}
      cnpg_version: ${{ inputs.cnpg_version }}
  gate:
    if: ${{ always() }}
    needs:
    - discover
    - build
    runs-on: ubuntu-24.04
    steps:
    - env:
        DISCOVERY: ${{ needs.discover.result }}
        BUILDS: ${{ needs.build.result }}
        MATRIX: ${{ needs.discover.outputs.matrix }}
      run: |-
        test "$DISCOVERY" = success
        if [[ "$MATRIX" == '[]' ]]; then test "$BUILDS" = skipped; else test "$BUILDS" = success; fi
