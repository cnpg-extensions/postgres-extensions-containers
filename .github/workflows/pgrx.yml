name: PGRX workflow stub

on:
  push:
  workflow_dispatch:
    inputs:
      extension_name:
        description: "The pgrx extension to build (directory name)"
        required: true
        type: string
      local:
        description: "Use the local registry and skip GitHub-only side effects"
        required: false
        default: false
        type: boolean
      platform:
        description: "Single platform for local validation (linux/amd64 or linux/arm64); leave empty for multi-arch builds"
        required: false
        default: ""
        type: string
      distro:
        description: "Single Debian distro for local validation (bookworm or trixie); leave empty for both"
        required: false
        default: ""
        type: string

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

permissions: {}

jobs:
  pgrx:
    name: Dispatch pgrx target stub
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/pgrx_targets.yml
    with:
      extension_name: ${{ inputs.extension_name }}
      local: ${{ inputs.local }}
      platform: ${{ inputs.platform }}
      distro: ${{ inputs.distro }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
