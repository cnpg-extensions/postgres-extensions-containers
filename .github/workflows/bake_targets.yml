name: Build, test and publish a target extension

on:
  workflow_call:
    inputs:
      extension_name:
        description: "The PostgreSQL extension to build (directory name)"
        required: true
        type: string
      local:
        description: "Use a local registry and skip GitHub-only side effects"
        required: false
        default: false
        type: boolean
      platform:
        description: "Optional target platform (for example, linux/amd64)"
        required: false
        default: ""
        type: string
      distro:
        description: "Optional Debian distro (for example, bookworm)"
        required: false
        default: ""
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions: {}

jobs:
  testbuild:
    name: Build ${{ inputs.extension_name }}
    runs-on: ${{ github.repository_owner == 'cloudnative-pg' && 'ubuntu-latest-16-cores' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
      # Required by the cosign step
      id-token: write
    outputs:
      metadata: ${{ steps.build.outputs.metadata }}
      images: ${{ steps.images.outputs.images }}
      sbom_manifest: ${{ steps.sbom.outputs.manifest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install ScanCode
        env:
          # renovate: datasource=github-releases depName=aboutcode-org/scancode-toolkit versioning=semver
          SCANCODE_VERSION: 32.5.0
          SCANCODE_SHA256: 638adcd0af576d1f4d5b64dde228724b3ca4fdee2c4de20d88e4356be353f027
        run: |
          archive="${RUNNER_TEMP}/scancode-toolkit.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/aboutcode-org/scancode-toolkit/releases/download/v${SCANCODE_VERSION}/scancode-toolkit-v${SCANCODE_VERSION}_py3.12-linux.tar.gz" \
            --output "${archive}"
          echo "${SCANCODE_SHA256}  ${archive}" | sha256sum --check
          scancode_root="${RUNNER_TEMP}/scancode-toolkit"
          mkdir -p "${scancode_root}"
          tar -xzf "${archive}" --strip-components=1 -C "${scancode_root}"
          (cd "${scancode_root}" && ./configure)
          echo "${scancode_root}/venv/bin" >> "${GITHUB_PATH}"

      - name: Log in to the GitHub Container registry
        if: ${{ !inputs.local }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: 'linux/arm64'

      - name: Set up Docker Buildx for local E2E
        if: ${{ inputs.local }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=pg-extensions-e2e
          buildkitd-config-inline: |
            [registry."registry.pg-extensions:5000"]
              http = true
              insecure = true

      - name: Set up Docker Buildx
        if: ${{ !inputs.local }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        id: build
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_RECORD_UPLOAD: ${{ inputs.local && 'false' || 'true' }}
          DISTRO: ${{ inputs.distro }}
          environment: testing
          registry: ${{ inputs.local && 'registry.pg-extensions:5000' || format('ghcr.io/{0}', github.repository_owner) }}
          revision: ${{ github.sha }}
        with:
          source: ${{ inputs.local && '.' || '' }}
          files: ./docker-bake.hcl,./${{ inputs.extension_name }}/metadata.hcl
          push: true
          set: ${{ inputs.platform && format('*.platform={0}', inputs.platform) || '' }}

      # From bake's metadata, extract each unique tag (e.g. the ones with the timestamp)
      - name: Generated images
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        id: images
        run: |
          echo "images=$(jq -c --argjson local '${{ inputs.local }}' '[ .[]."image.name" | split(",")[] | select(test("[0-9]{12}")) ] | if $local then .[:1] else . end' <<< "$BUILD_METADATA")" >>  "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ !inputs.local }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # See https://github.blog/security/supply-chain-security/safeguard-container-signing-capability-actions/
        # and https://github.com/actions/starter-workflows/blob/main/ci/docker-publish.yml for more details on
        # how to use cosign.

      - name: Compose aggregate SBOMs
        id: sbom
        env:
          EXTENSION_NAME: ${{ inputs.extension_name }}
          IMAGE_REGISTRY: ${{ inputs.local && 'registry.pg-extensions:5000' || format('ghcr.io/{0}', github.repository_owner) }}
          DISTRO_FILTER: ${{ inputs.distro }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          compose_args=(--bake-file docker-bake.hcl)
          if [[ -n "${DISTRO_FILTER}" ]]; then
            compose_args+=(--distro "${DISTRO_FILTER}")
          fi
          if [[ -n "${PLATFORM}" ]]; then
            compose_args+=(--platform "${PLATFORM}")
          fi
          ./scripts/compose_sboms.sh "${compose_args[@]}"

      - name: Upload composed SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/extension-sbom/attestation-manifest.json
            ${{ runner.temp }}/extension-sbom/manifests
            ${{ runner.temp }}/extension-sbom/predicates

      # Even if we're testing we sign the images, so we can push them to production later if that's required
      - name: Sign images
        if: ${{ !inputs.local }}
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          jq -r '.[] | (."image.name" | sub(",.*";"")) + "@" + ."containerimage.digest"' <<< "$BUILD_METADATA" | \
            xargs cosign sign --yes

  attest-sboms:
    name: Attest aggregate SBOM (${{ matrix.sbom.target }})
    if: ${{ !inputs.local }}
    runs-on: ubuntu-24.04
    needs:
      - testbuild
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        sbom: ${{ fromJson(needs.testbuild.outputs.sbom_manifest) }}
    steps:
      - name: Download composed SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          path: extension-sboms

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest aggregate SBOM
        # If this pin changes, verify composer.toolVersions.actionsAttest in the SBOM manifest remains aligned.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.sbom.testingSubject }}
          subject-digest: ${{ matrix.sbom.indexDigest }}
          sbom-path: extension-sboms/${{ matrix.sbom.predicatePath }}
          push-to-registry: true
          create-storage-record: false

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    if: ${{ !inputs.local }}
    permissions:
      contents: read
      packages: read
      security-events: write
    needs:
      - testbuild
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJson(needs.testbuild.outputs.images)}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Security checks
        uses: cloudnative-pg/postgres-containers/.github/actions/security-scans@main
        with:
          image: "${{ matrix.image }}"
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          snyk_token: ${{ secrets.SNYK_TOKEN }}
          dockerfile: "${{ inputs.extension_name }}/Dockerfile"

  generate-smoke-test-matrix:
    name: Generate matrix for smoke tests
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      # main plus the latest and previous supported minor release branches.
      - name: Compute CNPG release matrix
        id: versions
        env:
          # renovate: datasource=github-tags depName=cloudnative-pg/cloudnative-pg versioning=semver-coerced extractVersion=^v(?<version>\d+\.\d+)\.\d+$
          LATEST_RELEASE: "1.30"
        run: |
          PREVIOUS_RELEASE=$(awk -F. '{print $1"."$2-1}' <<< "$LATEST_RELEASE")
          versions=$(jq -cn --arg latest "$LATEST_RELEASE" --arg previous "$PREVIOUS_RELEASE" \
            '["main", $previous, $latest]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    needs:
      - testbuild
      - generate-smoke-test-matrix
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJson(needs.testbuild.outputs.images)}}
        cnpg: ${{fromJson(needs.generate-smoke-test-matrix.outputs.versions)}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install Kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          # renovate: datasource=github-tags depName=kubernetes-sigs/kind versioning=semver
          version: v0.33.0
          install_only: true

      - name: Install Dagger
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.9
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh

      - name: Set up environment
        env:
          CNPG_RELEASE: ${{ matrix.cnpg }}
        run: |
          task e2e:setup-env CNPG_RELEASE=$CNPG_RELEASE

      - name: Generate Chainsaw testing values
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          EXTENSION_NAME: ${{ inputs.extension_name }}
        run: |
          task e2e:generate-values \
            REGISTRY_HOST_NAME="${{ inputs.local && 'registry.pg-extensions' || 'localhost' }}" \
            EXTENSION_IMAGE="${MATRIX_IMAGE}" TARGET="${EXTENSION_NAME}"

      - name: Run e2e tests
        env:
          EXTENSION_NAME: ${{ inputs.extension_name }}
        run: |
          # Get Kind cluster internal kubeconfig
          task e2e:export-kubeconfig KUBECONFIG_PATH=./kubeconfig INTERNAL=true

          task e2e:test TARGET="${EXTENSION_NAME}" KUBECONFIG_PATH="./kubeconfig"

  copytoproduction:
    name: Copy images to production
    if: ${{ github.ref == 'refs/heads/main' && !inputs.local }}
    runs-on: ubuntu-24.04
    needs:
      - testbuild
      - attest-sboms
      - security
      - smoke-test
    permissions:
      contents: read
      packages: write
      # Required by the cosign step
      id-token: write
    steps:
      - name: Copy to production
        uses: cloudnative-pg/postgres-containers/.github/actions/copy-images@main
        with:
          bake_build_metadata: "${{ needs.testbuild.outputs.metadata }}"
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download composed SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          path: extension-sboms

      - name: Verify copied aggregate SBOM subjects
        run: |
          set -Eeuo pipefail

          jq -e 'type == "array" and length > 0' extension-sboms/attestation-manifest.json > /dev/null
          while IFS= read -r record; do
            jq -e 'all(.testingImage, .productionImage, .indexDigest; type == "string" and length > 0)' <<< "${record}" > /dev/null
            predicate="extension-sboms/$(jq -r '.predicatePath' <<< "${record}")"
            jq -e --arg namespace "https://github.com/cnpg-extensions/postgres-extensions-containers/sbom-composition/v1" '
              .spdxVersion == "SPDX-2.3" and
              .SPDXID == "SPDXRef-DOCUMENT" and
              any((.annotations // [])[];
                .spdxElementId == "SPDXRef-DOCUMENT" and
                .annotationType == "OTHER" and
              (.comment | startswith($namespace + " ")))' \
              "${predicate}"

            test "$(docker buildx imagetools inspect "$(jq -r '.productionImage' <<< "${record}")" --raw | \
              sha256sum | awk '{print "sha256:" $1}')" = "$(jq -r '.indexDigest' <<< "${record}")"
          done < <(jq -c '.[]' extension-sboms/attestation-manifest.json)

  attest-production-sboms:
    name: Attest production aggregate SBOM (${{ matrix.sbom.target }})
    if: ${{ github.ref == 'refs/heads/main' && !inputs.local }}
    runs-on: ubuntu-24.04
    needs:
      - copytoproduction
      - testbuild
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        sbom: ${{ fromJson(needs.testbuild.outputs.sbom_manifest) }}
    steps:
      - name: Download composed SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          path: extension-sboms

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest production aggregate SBOM
        # If this pin changes, verify composer.toolVersions.actionsAttest in the SBOM manifest remains aligned.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.sbom.productionSubject }}
          subject-digest: ${{ matrix.sbom.indexDigest }}
          sbom-path: extension-sboms/${{ matrix.sbom.predicatePath }}
          push-to-registry: true
          create-storage-record: false
