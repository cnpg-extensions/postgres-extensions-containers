name: Retry failed builds once

# workflow_run listeners must exist on the default branch to receive events.
on:
  workflow_run:
    workflows: ["Build, test and publish extensions"]
    types: [completed]

permissions: {}

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs once
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;

            // Retry only the original attempt; a failed retry stops here.
            if (run.run_attempt !== 1) {
              core.info(`Not retrying attempt ${run.run_attempt}`);
              return;
            }

            core.info(`Retrying failed jobs for run ${run.id}`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
