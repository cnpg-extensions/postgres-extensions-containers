name: PGRX platform builds
'on':
  workflow_call:
    inputs: &id001
      extension_name:
        description: PGRX extension directory
        type: string
        required: true
      cnpg_version:
        description: Optional CNPG full version or main
        type: string
        required: false
        default: ''
    secrets:
      SNYK_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *id001
permissions: {}
defaults:
  run:
    shell: bash -Eeuo pipefail {0}
jobs:
  generate-smoke-test-matrix:
    uses: ./.github/workflows/cnpg-versions.yml
    with:
      cnpg_version: ${{ inputs.cnpg_version }}
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    env:
      # renovate: datasource=docker depName=ghcr.io/cnpg-extensions/cnpg-sbom-generator versioning=docker
      SBOM_GENERATOR: ghcr.io/cnpg-extensions/cnpg-sbom-generator:latest@sha256:9909ad887161b18d68f1e84c5568be3e8d3072ad861be843b596a0fdb6c48678
    steps:
    - &id002
      name: Use current workspace
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Write typed inputs
      env:
        INPUTS_JSON: ${{ toJSON(inputs) }}
      run: printf '%s\n' "$INPUTS_JSON" > "$RUNNER_TEMP/pgrx-inputs.json"
    - id: prepare
      name: Prepare native targets
      run: python3 pgrx/prepare.py --inputs "$RUNNER_TEMP/pgrx-inputs.json" --generator "$SBOM_GENERATOR" --output
        "$RUNNER_TEMP/prepared"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: prepared-${{ inputs.extension_name }}
        path: ${{ runner.temp }}/prepared
        if-no-files-found: error
  build-platform:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
    - *id002
    - &id004
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: prepared-${{ inputs.extension_name }}
        path: ${{ runner.temp }}/prepared
    - &login
      name: Log in to the GitHub Container registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Require native build execution
      env:
        ARCHITECTURE: ${{ matrix.architecture }}
        BUILDER: ${{ steps.buildx.outputs.name }}
      run: python3 pgrx/build.py --architecture "$ARCHITECTURE" --builder "$BUILDER"
    - name: Build and push
      id: build
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
      env:
        BUILDX_METADATA_PROVENANCE: disabled
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        source: .
        builder: ${{ steps.buildx.outputs.name }}
        files: ${{ runner.temp }}/prepared/${{ matrix.id }}.json
        targets: ${{ matrix.target }}
        push: true
    - name: Save platform build metadata
      env:
        BUILD_METADATA: ${{ steps.build.outputs.metadata }}
      run: |
        mkdir "$RUNNER_TEMP/record"
        printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/record/metadata.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: platform-${{ inputs.extension_name }}-${{ matrix.id }}
        path: ${{ runner.temp }}/record
        if-no-files-found: error
  assemble:
    needs:
    - prepare
    - build-platform
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      metadata: ${{ steps.images.outputs.metadata }}
      provenance_matrix: ${{ steps.images.outputs.provenance_matrix }}
      production_provenance_matrix: ${{ steps.images.outputs.production_provenance_matrix }}
    steps:
    - *id002
    - *id004
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: platform-${{ inputs.extension_name }}-*
        path: ${{ runner.temp }}/records
    - *login
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Merge complete platform indexes
      run: python3 pgrx/assemble.py --preparation "$RUNNER_TEMP/prepared" --records "$RUNNER_TEMP/records" --output
        "$RUNNER_TEMP/assemblies"
    - name: Export build metadata and provenance matrices
      id: images
      run: |
        echo "metadata=$(jq -cs add "$RUNNER_TEMP"/assemblies/*/metadata.json)" >> "$GITHUB_OUTPUT"
        # Attest each assembled multi-platform index, once per repository/digest.
        matrix=$(jq -cs '[ .[] | .[] | {
          image: (."image.name" | split(",")[0] | split(":")[0]),
          digest: ."containerimage.digest"
        } ] | unique_by([.image, .digest])' "$RUNNER_TEMP"/assemblies/*/metadata.json)
        echo "provenance_matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "production_provenance_matrix=$(jq -c 'map(.image |= sub("-testing$"; ""))' <<< "$matrix")" >> "$GITHUB_OUTPUT"
    # Assembly signs immutable digests using the standard installer. Security and
    # smoke consume those digests directly instead of downloading assembly records.
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Sign assembled images
      env:
        BUILD_METADATA: ${{ steps.images.outputs.metadata }}
      run: |
        jq -r '.[] | (."image.name" | split(",")[0] | split(":")[0]) + "@" + ."containerimage.digest"' <<< "$BUILD_METADATA" | \
          sort -u | xargs cosign sign --yes --new-bundle-format=false --use-signing-config=false
  # The shared SLSA generator attests each assembled testing index. Its success
  # is required for promotion; the destination gets its own attestation afterward.
  provenance:
    name: Provenance for testing images
    needs: assemble
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.assemble.outputs.provenance_matrix) }}
    # The SLSA generator requires a full version tag rather than a SHA pin.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
  security:
    name: Security checks
    needs: assemble
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.assemble.outputs.provenance_matrix) }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
    - *id002
    - name: Security checks
      uses: cloudnative-pg/postgres-containers/.github/actions/security-scans@main
      with:
        image: ${{ format('{0}@{1}', matrix.image, matrix.digest) }}
        registry_user: ${{ github.actor }}
        registry_token: ${{ secrets.GITHUB_TOKEN }}
        snyk_token: ${{ secrets.SNYK_TOKEN }}
        dockerfile: ${{ inputs.extension_name }}/Dockerfile
  smoke:
    needs:
    - assemble
    - generate-smoke-test-matrix
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.assemble.outputs.provenance_matrix) }}
        cnpg: ${{ fromJSON(needs.generate-smoke-test-matrix.outputs.versions) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/smoke.yml
    with:
      extension_name: ${{ inputs.extension_name }}
      image: ${{ format('{0}@{1}', matrix.image.image, matrix.image.digest) }}
      cnpg_version: ${{ matrix.cnpg }}
  # Use Debian's shared copy-images action with combined Bake metadata. It copies
  # the checked images and signs their production digests; production-provenance
  # then attests each index in its destination repository.
  promote:
    needs:
    - assemble
    - security
    - smoke
    - provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Copy images to production
      uses: cloudnative-pg/postgres-containers/.github/actions/copy-images@main
      with:
        bake_build_metadata: ${{ needs.assemble.outputs.metadata }}
        registry_user: ${{ github.actor }}
        registry_token: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
  production-provenance:
    name: Provenance for production images
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
    - assemble
    - promote
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.assemble.outputs.production_provenance_matrix) }}
    # Generate in the destination repository: image copying does not copy this attestation.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
  gate:
    if: ${{ always() }}
    needs:
    - prepare
    - generate-smoke-test-matrix
    - build-platform
    - assemble
    - security
    - smoke
    - promote
    - provenance
    - production-provenance
    runs-on: ubuntu-24.04
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        PROMOTION_ALLOWED: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      run: |-
        python3 - <<'PY'
        import json, os
        results=json.loads(os.environ['RESULTS'])
        for name,value in results.items():
            if name in ('promote', 'production-provenance') and os.environ['PROMOTION_ALLOWED']=='false' and value['result']=='skipped': continue
            if value['result']!='success': raise SystemExit(f"required job {name}: {value['result']}")
        PY
