name: Build, test and publish extensions

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      expected_sha:
        description: Authorized event head; reject a newer PR revision
        type: string
        required: true
    secrets:
      SNYK_TOKEN:
        required: false
  # Required gates must report even when no extension needs rebuilding.
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; selects changed extensions and disables production publishing
        type: string
        default: ''
      extension_name:
        description: "The PostgreSQL extension directory, or all to rebuild every extension"
        required: false
        type: string

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

permissions: {}

jobs:
  # Select changed payloads and representative branch validation targets.
  change-triage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Check changed files
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix}}
      ref: ${{ steps.pr.outputs.sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Resolve manual PR and start status
        if: inputs.pr_number != ''
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) throw new Error('Expected a PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.state !== 'open') throw new Error('PR must be open');
            if (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA) throw new Error('PR head changed; authorize the new event');
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.sha);
            core.setOutput('base_ref', pr.base.ref);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, context: 'Automerge gate', state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: ${{ inputs.pr_number != '' && '0' || '1' }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false

      - name: Fetch valid targets
        id: get-targets
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.11
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger/maintenance/
          args: get-targets

      - name: Validate extension name
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number == ''
        env:
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          if [[ "$INPUT_EXTENSION_NAME" != all ]] && ! echo "$VALID_TARGETS" | jq -e --arg ext "$INPUT_EXTENSION_NAME" 'index($ext)' > /dev/null; then
            echo "::error::'$INPUT_EXTENSION_NAME' is not a valid extension target. Use 'all' or one of: $VALID_TARGETS"
            exit 1
          fi

      - name: Compute paths-filter extensions block
        env:
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
        run: |
          if ! echo "$VALID_TARGETS" | jq -e 'length > 0' > /dev/null; then
            echo "::error::dagger get-targets returned no extensions: $VALID_TARGETS"
            exit 1
          fi
          {
            echo 'EXTENSIONS<<YAML_EOF'
            echo "$VALID_TARGETS" | jq -r '.[] |
              "\(.):\n  - \"\(.)/**\"\n  - \"!\(.)/test/**\"\n  - \"!\(.)/**/*.md\"\n_test_\(.):\n  - \"\(.)/test/**\""'
            echo 'YAML_EOF'
          } >> "$GITHUB_ENV"

      - name: Resolve manual PR diff base
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        id: diff-base
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          echo "sha=$(git merge-base HEAD "$BASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        if: github.event_name != 'workflow_dispatch' || inputs.pr_number != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.diff-base.outputs.sha }}
          ref: ${{ steps.pr.outputs.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            _shared:
              - 'docker-bake.hcl'
              - 'scripts/**'
              - 'Taskfile.yml'
              - 'test/**'
              - 'dagger/maintenance/**'
              - '.github/workflows/**'
            ${{ env.EXTENSIONS }}

      - name: Verify selected PR revision
        if: inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          TEST_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.head.sha !== process.env.TEST_SHA) throw new Error('PR changed during selection; rerun for the new head');

      # Only payload changes rebuild on main; shared and test changes validate on branches.
      - name: Compute matrix
        id: get-matrix
        env:
          # JSON array containing the extensions that have been changed
          CHANGES: ${{ steps.filter.outputs.changes }}
          # Input Extension name
          INPUT_EXTENSION_NAME: ${{ github.event.inputs.extension_name }}
          EVENT_NAME: ${{ inputs.pr_number != '' && 'manual_pr' || github.event_name }}
          SELECTION_REF: ${{ steps.pr.outputs.sha || github.ref }}
          VALID_TARGETS: ${{ steps.get-targets.outputs.output }}
          # SQL-only, native/preload, base-image dependencies, upstream PostGIS, OS libraries/data.
          INFRASTRUCTURE_SAMPLE: '["pgtap", "pg-cron", "powa", "mobilitydb", "ogr-fdw"]'
        run: |
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ "$INPUT_EXTENSION_NAME" == all ]]; then
              CHANGES="$VALID_TARGETS"
            else
              CHANGES=$(jq -cn --arg ext "$INPUT_EXTENSION_NAME" '[$ext]')
            fi
          else
            CHANGES=$(jq -ce --arg ref "$SELECTION_REF" --argjson targets "$VALID_TARGETS" \
              --argjson sample "$INFRASTRUCTURE_SAMPLE" '
              . as $changes
              | (map(select(startswith("_") | not))) as $direct
              | if $ref == "refs/heads/main" then $direct
                else
                  if ($sample - $targets | length) > 0 then
                    error("Infrastructure sample contains an unknown extension")
                  else
                    $direct + (map(select(startswith("_test_")) | ltrimstr("_test_")))
                    + (if $changes | index("_shared") then $sample else [] end)
                  end
                end | unique
            ' <<< "$CHANGES")
          fi

          echo "matrix=$(jq -c . <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

  Bake:
    name: Bake
    needs: change-triage
    permissions:
      actions: read
      packages: write
      contents: read
      id-token: write
      security-events: write
    if: ${{ join(fromJSON(needs.change-triage.outputs.matrix)) != '' }}
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.change-triage.outputs.matrix) }}
    uses: ./.github/workflows/bake_targets.yml
    with:
      extension_name: ${{ matrix.extension }}
      ref: ${{ needs.change-triage.outputs.ref }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  automerge-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'Automerge gate (fork preview)' || 'Automerge gate' }}
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - change-triage
      - Bake
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Verify build and test results
        env:
          DISCOVERY: ${{ needs.change-triage.result }}
          BUILDS: ${{ needs.Bake.result }}
          MATRIX: ${{ needs.change-triage.outputs.matrix }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          if os.environ['DISCOVERY'] != 'success':
              raise SystemExit('Extension discovery did not succeed')
          matrix = json.loads(os.environ['MATRIX'])
          if not isinstance(matrix, list) or any(not isinstance(x, str) or not x for x in matrix):
              raise SystemExit('Invalid extension matrix')
          expected = 'success' if matrix else 'skipped'
          if os.environ['BUILDS'] != expected:
              raise SystemExit(f"Expected builds={expected}, got {os.environ['BUILDS']}")
          PYTHON

      - name: Checkout Renovate changes
        if: needs.change-triage.outputs.ref != '' || startsWith(github.head_ref || github.ref_name, 'renovate/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.change-triage.outputs.ref }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check Renovate versions for prereleases
        if: needs.change-triage.outputs.ref != '' || startsWith(github.head_ref || github.ref_name, 'renovate/')
        env:
          DEFAULT_BRANCH: ${{ needs.change-triage.outputs.base_ref || github.base_ref || github.event.repository.default_branch }}
        run: |
          # Real examples: MobilityDB 1.3.0-alpha, HypoPG 2.0.0beta,
          # pg_partman 5.3.0RC1, MobilityDB 1.3.0~rc1-1.pgdg13+1.
          # Dockerfiles use EXT_VERSION from metadata and have no Renovate annotations.
          for FILE in */metadata.hcl */README.md; do
            DIFF=$(git diff --no-ext-diff --no-color --unified=2 "origin/$DEFAULT_BRANCH"...HEAD -- "$FILE")
            # Every metadata/README annotation is directly above its value; -A2
            # includes both the removed (-) and replacement (+) value lines.
            # Exclude annotations themselves: datasource contains the marker rc.
            if grep -EA2 '^[ +][[:space:]]*(//|#) renovate:' <<< "$DIFF" |
               grep '^\+' |
               grep -Ev '^\+[[:space:]]*(//|#)' |
               grep -Ei 'alpha|beta|rc|~'; then
              # AGE final releases retain rc in their version names.
              # https://github.com/apache/age/releases/tag/PG18/v1.8.0-rc0
              if [[ "${FILE%%/*}" == age ]]; then
                continue
              fi
              echo "::error file=$FILE::Renovate changed a version containing alpha, beta, rc, or ~ (see the added lines above). These markers can indicate an unstable prerelease, so the Automerge gate is failing to prevent automatic approval/merge. Before approving this PR, verify from the upstream release announcement that this exact version is a final production release. If it is a prerelease, use a stable version or close the update. If the marker is part of a confirmed final release's naming convention, document the evidence and add a narrowly scoped exception to this check, then rerun CI; approval alone does not clear the failed gate."
              exit 1
            fi
          done

      - name: CI passed
        run: echo "All required CI passed"

  Catalogs:
    name: Update Catalogs
    needs: [change-triage, automerge-gate]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    if: needs.change-triage.outputs.matrix != '[]' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target' && needs.change-triage.outputs.ref == ''
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          event-type: update-catalogs

  report-pr-status:
    if: ${{ always() && needs.change-triage.outputs.ref != '' }}
    needs: [change-triage, automerge-gate]
    runs-on: ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TEST_SHA: ${{ needs.change-triage.outputs.ref }}
          PASSED: ${{ needs.automerge-gate.result == 'success' }}
        with:
          script: |
            if (!/^[0-9a-f]{40}$/.test(process.env.TEST_SHA)) throw new Error('ref must be a full commit SHA');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.TEST_SHA, context: 'Automerge gate',
              state: process.env.PASSED === 'true' ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
