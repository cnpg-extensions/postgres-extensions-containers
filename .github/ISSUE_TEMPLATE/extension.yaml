name: New Extension Proposal
description: Propose a new PostgreSQL extension to be included in the containers.
title: "[New Extension]: "
labels: ["triage", "new-extension"]
projects: ["cnpg-extensions/postgres-extensions-containers"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new extension for the PostgreSQL Extensions Containers project!

        Repository maintainers maintain all extensions. Contributions are welcome through the [submission process](https://github.com/cnpg-extensions/postgres-extensions-containers?tab=readme-ov-file#submission-process).

  - type: checkboxes
    id: search
    attributes:
      label: Is there an existing issue for this extension request?
      description: Before you submit a request, please **search existing issues** to ensure this extension hasn't already been proposed.
      options:
        - label: I have searched for an existing issue, and could not find a duplicate request.
          required: true

  - type: input
    id: extension-name
    attributes:
      label: Extension Name
      description: What is the official name of the PostgreSQL extension?
      placeholder: ex. pgvector
    validations:
      required: true

  - type: input
    id: project-url
    attributes:
      label: Project Repository URL
      description: The URL of the main source code repository (e.g., GitHub, GitLab).
      placeholder: ex. https://github.com/pgvector/pgvector
    validations:
      required: true

  - type: input
    id: debian-package-name
    attributes:
      label: Debian Package Name
      description: |
        The name of the Debian package in the `main` component (which by
        definition complies with the [Debian Free Software Guidelines (DFSG)](https://www.debian.org/social_contract#guidelines)).
        The PGDG (PostgreSQL Global Development Group) repository is the recommended
        source, but other trusted, auditable Debian repositories are acceptable. Verify availability by running
        `apt search <name>` inside a
        `ghcr.io/cloudnative-pg/postgresql:<pg_version>-minimal-<distro>` container,
        and provide the repository URL if not PGDG.
      placeholder: ex. postgresql-<pg-major>-pgvector
    validations:
      required: true

  - type: input
    id: website-url
    attributes:
      label: Extension Website URL (Optional)
      description: The URL of the official website or main documentation page.
      placeholder: ex. https://pgvector.io/
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Short Description
      description: A brief description of the extension and its primary use case.
      placeholder: ex. The pgvector extension provides vector similarity search capabilities for PostgreSQL.
    validations:
      required: true

  - type: input
    id: license-url
    attributes:
      label: Main LICENSE Link
      description: A direct link to the main license file in the repository (e.g., a link to the raw LICENSE file).
      placeholder: ex. https://github.com/pgvector/pgvector/blob/master/LICENSE
    validations:
      required: true

  - type: dropdown
    id: license-spdx
    attributes:
      label: Extension License (SPDX identifier)
      description: |
        Select the SPDX license identifier for the extension. Distributed components
        must meet the [Open Source Licensing Policy](https://github.com/cnpg-extensions/postgres-extensions-containers/blob/main/source-build/README.md#open-source-licensing-policy).
        Select Other for a license not listed here and provide its identifier and
        terms in Additional Notes. Any exception requires explicit approval and documentation.
      options:
        - PostgreSQL
        - MIT
        - Apache-2.0
        - BSD-2-Clause
        - BSD-3-Clause
        - ISC
        - Other (provide license details)
    validations:
      required: true

  - type: checkboxes
    id: license-check
    attributes:
      label: License Compliance
      description: |
        The policy covers all distributed components, including libraries, utilities
        and bundled data, and requires compliance with applicable license obligations.
        Dependencies used only at build time and not distributed are outside its scope.
      options:
        - label: I have reviewed the Open Source Licensing Policy and identified any requested exceptions in Additional Notes.
          required: true

  - type: textarea
    id: dependent-extensions
    attributes:
      label: Known Dependent Extensions
      description: |
        List any other PostgreSQL extensions that must be present for this extension to
        function (i.e. extensions that must be created via `CREATE EXTENSION` before this
        one). This covers PostgreSQL-level dependencies only; OS-level system library
        dependencies are handled separately by the build system. If none, state "None".
      placeholder: ex. postgis
    validations:
      required: true

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes (Optional)
      description: Any other relevant information, required dependencies (like OS packages), or context that might be useful for packaging.
      placeholder: ex. This extension requires the 'openssl' library (OS package) to be installed.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/cloudnative-pg/governance/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
